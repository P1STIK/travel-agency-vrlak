<main class="checkout">

  <!-- HERO -->
  <section class="checkout__hero">
    <div class="container">
      <h1 class="checkout__hero-title">Rezervácia</h1>
      @if (tour(); as t) {
        <p class="checkout__hero-sub">{{ t.title }}</p>
      }
    </div>
  </section>

  <app-checkout-stepper [steps]="STEPS" [current]="step()" />

  <!-- CONTENT -->
  <div class="container checkout__body">

    <div class="checkout__form">
      @switch (step()) {
        @case (1) {
          <app-checkout-seats-step [form]="form" (next)="nextStep()" />
        }
        @case (2) {
          <app-checkout-passengers-step
            [form]="form"
            [loading]="store.loading()"
            [errorMsg]="store.error()"
            [isLoggedIn]="customerAuth.isLoggedIn()"
            [loginReturnUrl]="loginReturnUrl"
            (back)="prevStep()"
            (submit)="createBooking()"
            (fileSelected)="onInsuranceFileSelected($event)"
          />
        }
        @case (3) {
          <app-checkout-payment-step
            [bookingId]="store.bookingId()"
            [loading]="store.loading()"
            [errorMsg]="store.error()"
            (pay)="pay()"
          />
        }
      }
    </div>

    <app-checkout-summary
      [tour]="tour()"
      [departureId]="departureId"
      [unitPriceCents]="unitPriceCents"
      [seats]="form.get('seats')?.value ?? 1"
      [quote]="store.quote()"
    />

  </div>
</main>
