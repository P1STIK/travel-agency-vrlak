<div class="card">
  <h2 class="card__heading">Zmena hesla</h2>

  @if (error()) {
    <p class="form-error">{{ error() }}</p>
  }
  @if (success()) {
    <p class="account-success">Heslo bolo zmenené.</p>
  }

  <form class="form" (ngSubmit)="submit()">
    <label class="field">
      <span class="field__label">Súčasné heslo *</span>
      <input class="field__input" type="password" [(ngModel)]="form.currentPassword" name="currentPassword" autocomplete="current-password" required />
    </label>

    <div class="form__row">
      <label class="field">
        <span class="field__label">Nové heslo *</span>
        <input class="field__input" type="password" [(ngModel)]="form.newPassword" name="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required />
      </label>
      <label class="field">
        <span class="field__label">Nové heslo znova *</span>
        <input class="field__input" type="password" [(ngModel)]="form.confirmPassword" name="confirmPassword" autocomplete="new-password" required />
      </label>
    </div>

    <div class="card__actions">
      <button class="btn btn--primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Ukladám...' : 'Zmeniť heslo' }}
      </button>
    </div>
  </form>
</div>
