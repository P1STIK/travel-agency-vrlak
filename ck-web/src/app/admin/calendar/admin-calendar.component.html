<div class="cal-page">

  <app-admin-calendar-toolbar
    [activeTab]="activeTab()"
    [viewMode]="viewMode()"
    [headerLabel]="headerLabel()"
    (switchTab)="switchTab($event)"
    (navigate)="navigate($event)"
    (goToday)="goToday()"
    (setViewMode)="setViewMode($event)"
  />

  @if (loading()) {
    <div class="cal-loading">Načítavam...</div>
  }

  @switch (activeTab()) {
    @case ('calendar') {
      <app-admin-calendar-grid-view
        [calendarData]="calendarData()"
        [drivers]="drivers()"
        [currentDate]="currentDate()"
        [viewMode]="viewMode()"
        [canCreateRide]="canCreateRide()"
        (openNewRide)="openNewRide($event)"
        (openEditDeparture)="openEditDeparture($event)"
        (openEditRide)="openEditRide($event)"
      />
    }
    @case ('drivers') {
      <app-admin-calendar-drivers-view
        [calendarData]="calendarData()"
        [drivers]="drivers()"
        [currentDate]="currentDate()"
      />
    }
    @case ('timeline') {
      <app-admin-calendar-timeline-view
        [calendarData]="calendarData()"
        [drivers]="drivers()"
      />
    }
  }

</div>

<app-admin-calendar-ride-panel
  [editState]="editState()"
  [newRideState]="newRideState()"
  [drivers]="drivers()"
  [buses]="buses()"
  [saving]="saving()"
  [error]="error()"
  (close)="closePanel()"
  (saveEdit)="saveEdit()"
  (saveNewRide)="saveNewRide()"
  (deleteRide)="deleteRide()"
/>
